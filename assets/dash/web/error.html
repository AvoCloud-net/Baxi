<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baxi -  Error</title>
    <link rel="shortcut icon" href="{{ cdn.favicon }}" type="image/x-icon">
    <meta property="og:title" content="Baxi -  Error">
    <meta property="og:url" content="https://baxi.avocloud.net/">
    <meta property="og:color" content="#FF6B4A">

    <script src="{{ cdn.tailwind_js }}"></script>
    <link rel="preconnect" href="{{ cdn.origin }}" crossorigin>
    <link rel="stylesheet" href="{{ cdn.fonts_css }}">
    <link rel="stylesheet" href="{{ cdn.basecoat_css }}">
    <link rel="stylesheet" href="{{ cdn.ui_base_css }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}?v={{ static_versions.get('main.css', '') }}">
    <script src="{{ url_for('static', filename='scripts/theme.js') }}?v={{ static_versions.get('scripts/theme.js', '') }}"></script>
</head>

<body class="avo-ui">

    <!-- Nav -->
    <nav class="site-nav" id="site-nav">
        <a class="avocloud-logo" href="/" aria-label="AVOCLOUD.NET">
            <span class="avocloud-logo__slot">
                <span class="avocloud-logo__icon">
                    <svg viewBox="0 0 72 72" fill="none">
                        <path d="M22 18 L12 18 L12 54 L22 54 M50 18 L60 18 L60 54 L50 54 M26 30 L33 36 L26 42"
                            stroke="currentColor" stroke-width="6"
                            stroke-linecap="round" stroke-linejoin="round"
                            pathLength="200"/>
                        <rect class="logo-cursor" x="40" y="28" width="4" height="16" rx="2"/>
                    </svg>
                </span>
                <span class="avocloud-logo__av">AVO</span>
            </span>
            <span class="avocloud-logo__rest-wrap">
                <span class="avocloud-logo__rest">CLOUD<span class="avocloud-logo__dot">.NET</span></span>
            </span>
        </a>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
            <svg id="theme-icon" viewBox="0 0 24 24"></svg>
        </button>
    </nav>

    <div class="max-w-6xl mx-auto px-4 sm:px-6">
        <div class="page-header">
            <p class="font-mono text-xs tracking-widest mb-1" style="color: var(--avo-error);">ERR</p>
            <h1 class="text-3xl font-semibold">Request Failed</h1>
            <p class="text-muted">"{{message}}"</p>
        </div>

        <main class="pb-24">
            <section class="pb-16">
                <div class="section-label">WHAT HAPPENED</div>
                <!-- Error state (BRANDING §9): an `error` left strip, a mono ERR serial, the
                     actual message in the body face (above), and a way out. -->
                <div class="card is-error">
                    <header>
                        <h2 class="text-xl font-semibold flex items-center gap-2">
                            <svg class="lucide" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="12" y1="8" x2="12" y2="12"/>
                                <line x1="12" y1="16" x2="12.01" y2="16"/>
                            </svg>
                            Something went wrong
                        </h2>
                        <p class="text-muted">The request could not be completed. Please check the details above and try again.</p>
                    </header>
                    <section>
                        <a href="/" class="btn inline-flex items-center gap-2" data-variant="secondary" data-size="default">
                            <svg class="lucide" viewBox="0 0 24 24">
                                <path d="m12 19-7-7 7-7"/>
                                <path d="M19 12H5"/>
                            </svg>
                            Back to home
                        </a>
                    </section>
                </div>
            </section>

            <div style="display: flex; gap: 1.5rem; justify-content: center; padding: 0.5rem 0 1rem; flex-wrap: wrap;">
                <a href="/privacy/" class="footer-link">Privacy Policy</a>
                <a href="/terms/" class="footer-link">Terms of Service</a>
                <a href="https://avocloud.net/impressum.html" class="footer-link">Impressum</a>
            </div>
            <footer class="site-footer">
                <p>Avocloud.net &mdash; Baxi Dashboard</p>
            </footer>
        </main>
    </div>

    <script src="{{ url_for('static', filename='scripts/main.js') }}?v={{ static_versions.get('scripts/main.js', '') }}"></script>
    
</body>

</html>
